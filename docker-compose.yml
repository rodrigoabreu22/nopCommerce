services:
    nopcommerce_web:
        build: .
        container_name: nopcommerce
        ports:
            - "80:80"
        environment:
            OTEL_SERVICE_NAME: "nopCommerce"
            OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
            OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
            OTEL_RESOURCE_ATTRIBUTES: "service.namespace=nopcommerce,service.instance.id=nopcommerce_web"
        depends_on:
            - nopcommerce_database
            - otel-collector
    nopcommerce_database:
        image: "mcr.microsoft.com/mssql/server:2019-latest"
        container_name: nopcommerce_mssql_server
        environment:
            SA_PASSWORD: "nopCommerce_db_password"
            ACCEPT_EULA: "Y"
            MSSQL_PID: "Express"
    otel-collector:
        image: "otel/opentelemetry-collector-contrib:0.105.0"
        container_name: otel-collector
        command: ["--config=/etc/otelcol/otel-collector-config.yml"]
        volumes:
            - "./otel-collector-config.yml:/etc/otelcol/otel-collector-config.yml:ro"
        ports:
            - "4317:4317" # OTLP gRPC
            - "4318:4318" # OTLP HTTP
            - "8889:8889" # Prometheus exporter
        depends_on:
            - jaeger
    jaeger:
        image: "jaegertracing/all-in-one:1.61.0"
        container_name: jaeger
        ports:
            - "16686:16686" # UI
            - "14250:14250" # gRPC
            - "14268:14268" # HTTP
    prometheus:
        image: "prom/prometheus:v2.53.1"
        container_name: prometheus
        volumes:
            - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
        ports:
            - "9090:9090"
        depends_on:
            - otel-collector
    grafana:
        image: "grafana/grafana:11.1.4"
        container_name: grafana
        ports:
            - "3000:3000"
        volumes:
            - "./grafana/provisioning:/etc/grafana/provisioning:ro"
            - "./grafana/dashboards:/var/lib/grafana/dashboards:ro"
        depends_on:
            - prometheus

volumes:
  nopcommerce_data:            
